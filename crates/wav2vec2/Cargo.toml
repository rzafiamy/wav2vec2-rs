[package]
name = "wav2vec2"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "wav2vec 2.0 / XLS-R CTC speech recognition in Rust/Candle, GGUF weights, KenLM-compatible beam search"
keywords.workspace = true
categories.workspace = true

[features]
default = []
cuda = ["candle-core/cuda", "candle-nn/cuda"]
metal = ["candle-core/metal", "candle-nn/metal"]

[dependencies]
candle-core.workspace = true
candle-nn.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
symphonia = { version = "0.5", default-features = false, features = ["wav", "pcm", "flac", "mp3", "ogg", "vorbis", "isomp4", "aac", "alac", "adpcm"] }
hound = "3.5"
rayon = "1"
